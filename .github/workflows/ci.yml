name: CI

# One workflow, Linux only, on a pinned runner image (harness plan, section 5).
#
# What is deliberately not here:
#   - A macOS runner. AGENTS.md: linux only. macOS is checked by hand on the
#     maintainer's Mac (ADR-0004).
#   - The Guix container. Nothing in CI runs it (ADR-0006): the toolchain here
#     is Chez built from its release tarball (ADR-0001), and the runner's
#     SQLite and packages (packaging/debian-prereqs.txt).
#
# The jobs, all independent, and every one of them on every event below: each
# pull request, each push to main or a v* tag, and each run asked for from the
# Actions tab. No path filter: a check that a change skips is no check.
#   main        every action pinned to a commit, the runner's SQLite
#               reported, every check, then the suites.
#   memory      the Valgrind gate (ADR-0005): the planted defects must fail
#               it, then every suite runs under it.
#   nothreads   every library under src/ must be refused, by name, on a Chez
#               built with --nothreads (ADR-0001, amended).
#
# This workflow states no floor. scripts/ci/build-chez.sh takes no version and
# reads its own from packaging/floors.sexp (ADR-0008), and so does any step
# that needs a floor, through scripts/ci/floor.sh. So nothing written here, an
# env value or a matrix value, changes what is built or checked. `make
# check-floors` holds every file in this directory: no line may contain either
# floor's version, a comment included.
#
# Every action is pinned to a full commit SHA, with its tag in a comment: a
# tag can be moved to other code, a commit cannot. The main job's first check,
# scripts/ci/check-action-pins.sh, fails on any line with a uses key that is
# not exactly that, whatever the key's spelling.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, its ref, and cancel-in-progress is
# true there: a new push to the pull request cancels its run in progress, and
# any run still pending. Every other run, a push to main or a tag, or a run
# asked for by hand, has a group of its own, its run id, so it never waits
# behind another and is never cancelled for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every Chez cache is keyed by what it holds: the floors file, which names the
# version, the build script, the build flags (a threaded Chez and a
# --nothreads Chez are two entries), and the runner image. A changed floor or
# build is never served stale. Each cache is restored and saved in two steps,
# so a build is banked even when a later step fails. Every job builds what it
# needs: a cold cache costs each job a build, once, and the first to save
# wins.

jobs:
  main:
    name: main (checks and suites, Chez built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Every line with a uses key in this directory is the form of a full
      # commit SHA with its tag in a comment. It needs only the checkout, so it
      # runs first.
      - name: Every action is pinned to a commit
        run: scripts/ci/check-action-pins.sh .github/workflows

      # The one package list. A failed grep must not become an empty install.
      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/build-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Report the versions this run uses
        run: |
          "$RUNNER_TEMP/chez-threads/bin/scheme" --version
          cc --version | head -n 1
          valgrind --version
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "kernel: $(uname -r)"

      # The runner's own SQLite, which the main lane tests (harness plan,
      # section 5): its version, its header's, and its compile options, read
      # through the FFI, never from a sqlite3 command, which can carry its own
      # copy (AGENTS.md). A report only: M1 holds the library to its floor and
      # its header.
      - name: Report the runner's SQLite
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/report-sqlite.sh

      # CHEZ is the real binary, not a symlink or a wrapper.
      - name: Checks and suites
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-help check-suites check-pins check-floors test check-test-fails check-clean

  # The Valgrind gate, on every run (ADR-0005). check-memory-gate requires this
  # job to run make check-memory-gate before make test-memory, each as a
  # step's whole run line, and neither the job nor those two steps to carry
  # an if: or a continue-on-error: key.
  memory:
    name: memory (the Valgrind gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/build-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      # The gate proves nothing unless it can fail, so the planted defects run
      # first: a heap overrun and a definite leak must each fail it, by
      # Valgrind's own marker. Outside any Guix environment, as in the
      # container: no suppression is passed, and no flag that hides a report.
      - name: The gate must fail on planted defects
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-memory-gate

      - name: Every suite under Valgrind
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make test-memory

  nothreads:
    name: nothreads (every library is refused on a Chez without threads)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez without threads
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: chez-nothreads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/build-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-nothreads" --nothreads

      - name: Save Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      # No submodules, no deps: the check imports only src/.
      - name: Every library must be refused, by name
        env:
          CHEZ: ${{ runner.temp }}/chez-nothreads/bin/scheme
        run: make check-nothreads
