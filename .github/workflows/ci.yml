name: CI

# One workflow, Linux only, on a pinned runner image (harness plan, section 5).
#
# What is deliberately not here:
#   - A macOS runner. AGENTS.md: linux only. macOS is checked by hand on the
#     maintainer's Mac (ADR-0004).
#   - The Guix container. Nothing in CI runs it (ADR-0006): the toolchain here
#     is Chez built from its release tarball (ADR-0001), and the runner's
#     SQLite and packages (packaging/debian-prereqs.txt).
#
# The jobs, all independent, and every one of them on every event below: each
# pull request, each push to main or a v* tag, and each run asked for from the
# Actions tab. No path filter: a check that a change skips is no check.
#   main        every action pinned to a commit, the runner's SQLite
#               reported, then found by discovery and accepted (ADR-0002's
#               install check), every check, then the suites.
#   memory-1, memory-2
#               the Valgrind gate (ADR-0005), in two shards (amended in M3
#               slice 6): in each, the planted defects must fail it, then the
#               shard's suites run under it. Between them they run every suite
#               once: the Makefile lists each shard's.
#   nothreads   every library under src/ must be refused, by name, on a Chez
#               built with --nothreads (ADR-0001, amended).
#   floor       SQLite at its floor, built from source: its version, source id
#               and compile options checked whole, then make build and the
#               suites against it.
#   current     the same against the current SQLite release, which the build
#               script pins; then that release built again without
#               extension loading, checked, and the suites run whole against
#               it (M4's closing review).
#
# This workflow states no floor. scripts/ci/build-chez.sh takes no version and
# reads its own from packaging/floors.sexp (ADR-0008), and so does any step
# that needs a floor, through scripts/ci/floor.sh. `make check-floors` holds
# every file in this directory: no line may contain either floor's version, a
# comment included.
#
# Every action is pinned to a full commit SHA, with its tag in a comment: a
# tag can be moved to other code, a commit cannot. The main job's first check,
# scripts/ci/check-action-pins.sh, fails on any line with a uses key that is
# not exactly that. It reads text, so it cannot see a key spelled another
# way.
#
# `make check-ci` (tests/check-ci.sh), which make test runs, holds this file
# to the one shape it reads: these triggers, these six jobs and their keys,
# each check as a step's whole run line, no if: but on the cache's own steps,
# no variable that would steer a check (but the two names floor and current
# hold, as exact env keys of the steps that name a SQLite build), and no key
# spelled so that a text check would miss it. A change to the workflow
# changes tests/check-ci.sh with it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, its ref, and cancel-in-progress is
# true there: a new push to the pull request cancels its run in progress, and
# any run still pending. Every other run, a push to main or a tag, or a run
# asked for by hand, has a group of its own, its run id, so it never waits
# behind another and is never cancelled for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every Chez cache is keyed by what it holds: the floors file, which names the
# version, the scripts that read it, build and check it, the build's name (a
# threaded Chez and a --nothreads Chez are two entries), and the runner's OS
# release and architecture. Each cache is restored and saved in two steps, so
# a build is banked even when a later step fails. Every job builds what it
# needs: a cold cache costs each job a build, once, and the first to save
# wins. Whether it was built or restored, scripts/ci/check-chez.sh then asks
# the Chez itself for its version and (threaded?), so a cache that serves
# another build fails the job before any check runs on it. The three SQLite
# caches are keyed the same way, by the scripts that build and check them, the
# runner's image and the C compiler (and, for the floor's, by the floors file
# and its reader), and are checked after a restore as after a build.

jobs:
  main:
    name: main (checks and suites, Chez built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Every line with a uses key in this directory is the form of a full
      # commit SHA with its tag in a comment. It needs only the checkout, so it
      # runs first.
      - name: Every action is pinned to a commit
        run: scripts/ci/check-action-pins.sh .github/workflows

      # The one package list. A failed grep must not become an empty install.
      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Report the versions this run uses
        run: |
          "$RUNNER_TEMP/chez-threads/bin/scheme" --version
          cc --version | head -n 1
          valgrind --version
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "kernel: $(uname -r)"

      # The runner's own SQLite, which the main lane tests (harness plan,
      # section 5): its version, its header's, and its compile options, read
      # through the FFI, never from a sqlite3 command, which can carry its own
      # copy (AGENTS.md). A report only: M1 holds the library to its floor and
      # its header.
      - name: Report the runner's SQLite
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/report-sqlite.sh

      # ADR-0002's install check. No line here names the override, so make
      # build finds the runner's SQLite by discovery, in the FHS world, and
      # must accept it: any refusal fails this step, with build's reason. The
      # file it found is the path line of this step's log.
      - name: The install check, by discovery
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make build

      # CHEZ is the real binary, not a symlink or a wrapper. make test runs
      # check-ci, which holds this file's shape. check-variadic runs here,
      # after check-test-fails, and never inside make test (ADR-0001,
      # amended 2026-11-17).
      - name: Checks and suites
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-help check-suites check-pins check-floors check-ci test check-test-fails check-variadic check-dev check-clean

      # The launcher's own tests run no Guix: stand-ins take its place. They
      # need make test, so CHEZ too.
      - name: The launcher's host-side tests
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: sh tests/guix-env-launcher.sh

  # The Valgrind gate, on every run (ADR-0005), in two shards, memory-1 and
  # memory-2, that run side by side on runners of their own (amended in M3
  # slice 6). The Makefile lists each shard's suites, MEMORY_SUITES_1 and
  # MEMORY_SUITES_2, and make check-memory-shards, which make test runs, holds
  # that the two run every suite once between them. Each job proves the gate
  # on its own runner before its shard runs, since the Valgrind and the Chez
  # its suites run under are that runner's own, installed or restored there.
  # check-ci, which make test and check-memory-gate's case o both run,
  # requires each job to run make check-memory-gate before make test-memory
  # MEMORY_SHARD=1 or =2, its own shard's number, each as a step's whole run
  # line, and neither job nor those steps to carry an if: or a
  # continue-on-error: key. No env: names a shard or a list.
  memory-1:
    name: memory-1 (the Valgrind gate, shard 1 of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # The gate proves nothing unless it can fail, so the planted defects run
      # first, on this job's own runner: a heap overrun and a definite leak
      # must each fail it, by Valgrind's own marker. Outside any Guix
      # environment, as in the container: no suppression is passed, and no
      # flag that hides a report.
      - name: The gate must fail on planted defects
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-memory-gate

      - name: Shard 1's suites under Valgrind
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make test-memory MEMORY_SHARD=1

  memory-2:
    name: memory-2 (the Valgrind gate, shard 2 of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # The gate proves nothing unless it can fail, so the planted defects run
      # first, on this job's own runner: a heap overrun and a definite leak
      # must each fail it, by Valgrind's own marker. Outside any Guix
      # environment, as in the container: no suppression is passed, and no
      # flag that hides a report.
      - name: The gate must fail on planted defects
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make check-memory-gate

      - name: Shard 2's suites under Valgrind
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: make test-memory MEMORY_SHARD=2

  nothreads:
    name: nothreads (every library is refused on a Chez without threads)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez without threads
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: chez-nothreads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-nothreads" --nothreads

      - name: Save Chez without threads
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-nothreads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-nothreads" --nothreads

      # No submodules, no deps: the check imports only src/.
      - name: Every library must be refused, by name
        env:
          CHEZ: ${{ runner.temp }}/chez-nothreads/bin/scheme
        run: make check-nothreads

  # SQLite at its floor, compiled here from sqlite.org's source, with the
  # flags scripts/ci/build-sqlite.sh fixes (harness plan, section 5; ADR-0003,
  # decision 3). This file names no version: the script reads the floor from
  # packaging/floors.sexp. Before any suite runs, scripts/ci/check-sqlite.sh
  # asserts the version, the source id and every compile option of the
  # library the suites load, and that the compiler finds its header. The
  # steps that run it, make build and make test name the build in their env,
  # the override and the header's directory, which no other job may name:
  # main is the one job that tests discovery.
  floor:
    name: floor (the suites against SQLite at its floor, built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # SQLite lists the compiler that built it among its compile options,
      # which check-sqlite.sh holds whole, so the compiler is in the cache key:
      # an image that moves cc rebuilds, and never serves a stale library.
      - name: Name the C compiler for the cache key
        id: cc
        run: echo "id=$(cc --version | head -n 1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore SQLite at its floor
        id: sqlite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-floor
          key: sqlite-floor-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-sqlite.sh', 'scripts/ci/check-sqlite.sh') }}-${{ steps.image.outputs.id }}-${{ steps.cc.outputs.id }}

      - name: Build SQLite at its floor
        if: steps.sqlite.outputs.cache-hit != 'true'
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/build-sqlite.sh "$RUNNER_TEMP/sqlite-floor"

      - name: Save SQLite at its floor
        if: steps.sqlite.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-floor
          key: ${{ steps.sqlite.outputs.cache-primary-key }}

      - name: Check the SQLite this job runs
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-floor/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-floor/include
        run: scripts/ci/check-sqlite.sh "$RUNNER_TEMP/sqlite-floor"

      - name: Load SQLite at its floor
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-floor/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-floor/include
        run: make build

      - name: The suites against SQLite at its floor
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-floor/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-floor/include
        run: make test

  # SQLite at the current release, compiled here as the floor's is but with
  # FTS5, which the floor's build leaves out (ADR-0003, amended), by
  # scripts/ci/build-sqlite.sh --current: the release the script pins, no
  # floor, so it reads no floors file and its cache is not keyed by one. The
  # suites must pass on it as on the floor's. check-sqlite.sh asserts the
  # same things of it, and the same steps carry the same env, with this job's
  # own paths.
  #
  # Then a second build, --no-load: the same release and flags, with
  # -DSQLITE_OMIT_LOAD_EXTENSION, so the library lacks sqlite3_load_extension,
  # as Apple's does, and keeps FTS5, as Apple's does. Its five steps follow
  # this job's make test: its cache's restore, build and save, keyed and
  # guarded by their own id, then its check, then the whole make test again,
  # each of the last two with this build's env. A suite's branch for a
  # library without extension loading runs here, on every run, and not only
  # on the maintainer's Mac (M4's closing review).
  current:
    name: current (the suites against the current SQLite, built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install the packages in packaging/debian-prereqs.txt
        run: |
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages: a broken step, not an empty list"
            exit 1
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Identify the runner image
        id: image
        run: |
          . /etc/os-release
          echo "id=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore Chez
        id: chez
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: chez-threads-${{ hashFiles('packaging/floors.sexp', 'scripts/ci/floor.sh', 'scripts/ci/build-chez.sh', 'scripts/ci/check-chez.sh') }}-${{ steps.image.outputs.id }}

      - name: Build Chez
        if: steps.chez.outputs.cache-hit != 'true'
        run: scripts/ci/build-chez.sh "$RUNNER_TEMP/chez-threads"

      - name: Save Chez
        if: steps.chez.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chez-threads
          key: ${{ steps.chez.outputs.cache-primary-key }}

      - name: Check the Chez this job runs
        run: scripts/ci/check-chez.sh "$RUNNER_TEMP/chez-threads"

      # SQLite lists the compiler that built it among its compile options,
      # which check-sqlite.sh holds whole, so the compiler is in the cache key:
      # an image that moves cc rebuilds, and never serves a stale library.
      - name: Name the C compiler for the cache key
        id: cc
        run: echo "id=$(cc --version | head -n 1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore SQLite at the current release
        id: sqlite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-current
          key: sqlite-current-${{ hashFiles('scripts/ci/build-sqlite.sh', 'scripts/ci/check-sqlite.sh') }}-${{ steps.image.outputs.id }}-${{ steps.cc.outputs.id }}

      - name: Build SQLite at the current release
        if: steps.sqlite.outputs.cache-hit != 'true'
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/build-sqlite.sh "$RUNNER_TEMP/sqlite-current" --current

      - name: Save SQLite at the current release
        if: steps.sqlite.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-current
          key: ${{ steps.sqlite.outputs.cache-primary-key }}

      - name: Check the SQLite this job runs
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-current/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-current/include
        run: scripts/ci/check-sqlite.sh "$RUNNER_TEMP/sqlite-current" --current

      - name: Load SQLite at the current release
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-current/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-current/include
        run: make build

      - name: The suites against SQLite at the current release
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-current/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-current/include
        run: make test

      - name: Restore SQLite without extension loading
        id: sqlite-no-load
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-no-load
          key: sqlite-no-load-${{ hashFiles('scripts/ci/build-sqlite.sh', 'scripts/ci/check-sqlite.sh') }}-${{ steps.image.outputs.id }}-${{ steps.cc.outputs.id }}

      - name: Build SQLite without extension loading
        if: steps.sqlite-no-load.outputs.cache-hit != 'true'
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
        run: scripts/ci/build-sqlite.sh "$RUNNER_TEMP/sqlite-no-load" --no-load

      - name: Save SQLite without extension loading
        if: steps.sqlite-no-load.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlite-no-load
          key: ${{ steps.sqlite-no-load.outputs.cache-primary-key }}

      - name: Check the SQLite without extension loading
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-no-load/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-no-load/include
        run: scripts/ci/check-sqlite.sh "$RUNNER_TEMP/sqlite-no-load" --no-load

      - name: The suites against SQLite without extension loading
        env:
          CHEZ: ${{ runner.temp }}/chez-threads/bin/scheme
          CHEZ_SQLITE3_LIBRARY: ${{ runner.temp }}/sqlite-no-load/lib/libsqlite3.so.0
          C_INCLUDE_PATH: ${{ runner.temp }}/sqlite-no-load/include
        run: make test
